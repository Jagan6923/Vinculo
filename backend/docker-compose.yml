# Docker Compose for development
version: "3.8"

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=development
      - PORT=8000
    volumes:
      - ./uploads:/app/uploads
      - ./config:/app/config
    depends_on:
      - mongodb
    networks:
      - vinculo-network

  mongodb:
    image: mongo:5.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - vinculo-network

volumes:
  mongodb_data:

networks:
  vinculo-network:
    driver: bridge
